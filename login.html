<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SL Diagnostic - Secure Login</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #102A43; margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .login-box { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); width: 90%; max-width: 350px; text-align: center; }
        .login-box h2 { color: #102A43; margin-top: 0; }
        .login-box p { color: #627D98; font-size: 14px; margin-bottom: 25px; }
        
        input[type="text"], input[type="password"] { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 15px; outline: none; }
        input:focus { border-color: #1976D2; }
        
        .btn-login { background-color: #1976D2; color: white; border: none; padding: 15px; font-size: 16px; border-radius: 8px; width: 100%; font-weight: bold; cursor: pointer; margin-top: 15px; }
        .btn-login:active { background-color: #1565C0; }
        
        #error-msg { color: #D84315; font-size: 14px; font-weight: bold; margin-top: 10px; display: none; }
        #loading { display: none; color: #1976D2; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="login-box">
        <h2>🏥 SL Diagnostic</h2>
        <p>Authorized Staff Login Only</p>
        
        <input type="text" id="username" placeholder="Enter Username" autocomplete="off">
        <input type="password" id="password" placeholder="Enter Password">
        
        <button class="btn-login" onclick="attemptLogin()">🔐 Secure Login</button>
        
        <div id="loading">⏳ Checking credentials...</div>
        <div id="error-msg">❌ Invalid Username or Password!</div>
    </div>

    <script>
        const dbUrl = "https://diagnostic-center-74aa4-default-rtdb.firebaseio.com/lab_data.json";

        async function attemptLogin() {
            let u = document.getElementById('username').value.trim();
            let p = document.getElementById('password').value.trim();
            
            if(!u || !p) {
                showError("Please enter both fields!"); return;
            }

            document.getElementById('loading').style.display = 'block';
            document.getElementById('error-msg').style.display = 'none';

            try {
                let response = await fetch(dbUrl);
                let db = await response.json() || {};
                
                // SYSTEM BOOT: अगर डेटाबेस में कोई यूज़र नहीं है, तो पहला Super Admin अपने आप बना दें!
                if(!db.users) {
                    db.users = {
                        "admin": { password: "123", role: "Super Admin", name: "Sanjay (Owner)", active: true }
                    };
                    await fetch(dbUrl, { method: 'PUT', body: JSON.stringify(db) });
                }

                // Check Credentials
                if(db.users && db.users[u] && db.users[u].password === p) {
                    if (db.users[u].active === false) {
                        showError("⛔ This staff account is inactive. Please contact Super Admin.");
                        return;
                    }
                    // Login Success! Save data in phone's memory (localStorage)
                    let userData = { username: u, name: db.users[u].name, role: db.users[u].role, active: true };
                    localStorage.setItem('sl_active_user', JSON.stringify(userData));
                    
                    // SAVE LOG (किसने कब लॉग इन किया)
                    db.users[u].last_login = new Date().toLocaleString('en-IN');
                    await logActivity(db, db.users[u].name || u, "Logged into the system", "login");

                    window.location.href = db.users[u].role === 'Partner Lab' ? "patient_portal.html" : "index.html";
                } else {
                    showError("❌ Invalid Username or Password!");
                }
            } catch (error) {
                showError("Network error! Please check internet.");
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        }

        async function logActivity(db, username, action, type = "login") {
            if(!db.logs) db.logs = [];
            let now = new Date();
            db.logs.push({
                time: now.toLocaleString(),
                user: username,
                action: action,
                type: type
            });
            // Keep recent audit history without letting the database grow endlessly
            if(db.logs.length > 500) db.logs = db.logs.slice(-500); 
            await fetch(dbUrl, { method: 'PUT', body: JSON.stringify(db) });
        }

        function showError(msg) {
            let err = document.getElementById('error-msg');
            err.innerText = msg;
            err.style.display = 'block';
        }

        // Verify a previous session with the database before redirecting. A stale browser entry must not bypass login.
        (async function verifyExistingSession(){
            try {
                const saved = JSON.parse(localStorage.getItem('sl_active_user') || '{}');
                if (!saved.username) return;
                const response = await fetch(dbUrl, {cache:'no-store'});
                const db = await response.json() || {};
                const account = db.users && db.users[saved.username];
                if (!account || account.active === false || account.role !== saved.role) { localStorage.removeItem('sl_active_user'); return; }
                window.location.href = account.role === 'Partner Lab' ? 'patient_portal.html' : 'index.html';
            } catch (error) { localStorage.removeItem('sl_active_user'); }
        })();
    </script>
</body>
</html>
