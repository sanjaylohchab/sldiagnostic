<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SL Diagnostic - Secure Login</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #102A43; margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .login-box { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); width: 90%; max-width: 350px; text-align: center; }
        .login-box h2 { color: #102A43; margin-top: 0; }
        .login-box p { color: #627D98; font-size: 14px; margin-bottom: 25px; }
        
        input[type="text"], input[type="password"] { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 15px; outline: none; }
        input:focus { border-color: #1976D2; }
        
        .btn-login { background-color: #1976D2; color: white; border: none; padding: 15px; font-size: 16px; border-radius: 8px; width: 100%; font-weight: bold; cursor: pointer; margin-top: 15px; }
        .btn-login:active { background-color: #1565C0; }
        .btn-login:disabled { background-color: #90CAF9; cursor: not-allowed; }
        
        #error-msg { color: #D84315; font-size: 14px; font-weight: bold; margin-top: 10px; display: none; }
        #loading { display: none; color: #1976D2; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="login-box">
        <h2>🏥 SL Diagnostic</h2>
        <p>Authorized Staff Login Only</p>
        
        <input type="text" id="username" placeholder="Enter Username" autocomplete="off" onkeydown="if(event.key==='Enter') document.getElementById('password').focus()">
        <input type="password" id="password" placeholder="Enter Password" onkeydown="if(event.key==='Enter') attemptLogin()">
        
        <button class="btn-login" id="loginBtn" onclick="attemptLogin()">🔐 Secure Login</button>
        
        <div id="loading">⏳ Checking credentials...</div>
        <div id="error-msg">❌ Invalid Username or Password!</div>
    </div>

    <script>
        const baseDbUrl = "https://diagnostic-center-74aa4-default-rtdb.firebaseio.com/lab_data";

        function safeKey(key) {
            return String(key).replace(/[.#$\[\]\/]/g, '_');
        }

        async function attemptLogin() {
            let u = document.getElementById('username').value.trim();
            let p = document.getElementById('password').value.trim();
            
            if (!u || !p) {
                showError("Please enter both fields!");
                return;
            }

            let btn = document.getElementById('loginBtn');
            btn.disabled = true;
            document.getElementById('loading').style.display = 'block';
            document.getElementById('error-msg').style.display = 'none';

            try {
                let userKey = safeKey(u);
                // 🔥 FAST FETCH: Sirf isi user ka data mangwayenge, poora heavy database nahi!
                let response = await fetch(`${baseDbUrl}/users/${userKey}.json?nocache=${Date.now()}`, { cache: "no-store" });
                let account = await response.json();

                // SYSTEM BOOT: Agar 'admin' nahi mila, toh check karein ki users node khali toh nahi
                if (!account && u === "admin") {
                    let checkUsers = await fetch(`${baseDbUrl}/users.json?shallow=true`);
                    let usersExist = await checkUsers.json();
                    if (!usersExist) {
                        account = { password: "123", role: "Super Admin", name: "Sanjay (Owner)", active: true };
                        await fetch(`${baseDbUrl}/users/admin.json`, {
                            method: 'PUT',
                            body: JSON.stringify(account)
                        });
                    }
                }

                // Check Credentials
                if (account && String(account.password) === p) {
                    if (account.active === false) {
                        showError("⛔ This staff account is inactive. Please contact Super Admin.");
                        btn.disabled = false;
                        return;
                    }

                    // Save session in localStorage
                    let userData = {
                        username: u,
                        name: account.name || u,
                        role: account.role,
                        active: true
                    };
                    localStorage.setItem('sl_active_user', JSON.stringify(userData));

                    // 🔥 BACKGROUND LOGGING: User ko bina roke background me time aur log update karein
                    updateLoginAuditBackground(userKey, account.name || u);

                    // Instant Redirect
                    window.location.replace(account.role === 'Partner Lab' ? "patient_portal.html" : "index.html");
                } else {
                    showError("❌ Invalid Username or Password!");
                    btn.disabled = false;
                }
            } catch (error) {
                showError("Network error! Please check internet.");
                btn.disabled = false;
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        }

        function updateLoginAuditBackground(userKey, displayName) {
            try {
                // 1. Update last_login directly on user node
                fetch(`${baseDbUrl}/users/${userKey}/last_login.json`, {
                    method: 'PUT',
                    body: JSON.stringify(new Date().toLocaleString('en-IN')),
                    keepalive: true
                });

                // 2. Append log entry without downloading full database
                fetch(`${baseDbUrl}/logs.json`, {
                    method: 'POST',
                    body: JSON.stringify({
                        time: new Date().toLocaleString(),
                        user: displayName,
                        action: "Logged into the system",
                        type: "login"
                    }),
                    keepalive: true
                });
            } catch (e) { /* Silent background task */ }
        }

        function showError(msg) {
            let err = document.getElementById('error-msg');
            err.innerText = msg;
            err.style.display = 'block';
        }

        // Fast Session Verification (Only fetches the logged-in user's record)
        (async function verifyExistingSession() {
            try {
                const saved = JSON.parse(localStorage.getItem('sl_active_user') || '{}');
                if (!saved.username) return;
                
                let userKey = safeKey(saved.username);
                const response = await fetch(`${baseDbUrl}/users/${userKey}.json?nocache=${Date.now()}`, { cache: 'no-store' });
                const account = await response.json();
                
                if (!account || account.active === false || account.role !== saved.role) {
                    localStorage.removeItem('sl_active_user');
                    return;
                }
                window.location.replace(account.role === 'Partner Lab' ? 'patient_portal.html' : 'index.html');
            } catch (error) {
                localStorage.removeItem('sl_active_user');
            }
        })();
    </script>
</body>
</html>
